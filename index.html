<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çözelti Laboratuvarı — 3D Eğitimsel Kimya Oyunu</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
</head>
<body>
    <!-- 3D SAHNE (three.js + cannon-es) -->
    <div id="lab3d"></div>
    <div id="loading">Modeller yükleniyor…</div>

    <div id="app">
        <!-- ANA MENÜ -->
        <div id="screen-menu" class="screen active">
            <div class="menu-card">
                <div class="bubbles">
                    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
                </div>
                <h1 class="game-title">ÇÖZELTİ LABORATUVARI</h1>
                <p class="game-subtitle">3D Eğitimsel Kimya Laboratuvarı</p>
                <div class="menu-buttons">
                    <button class="menu-btn btn-green" onclick="showScreen('tutorial')">📚 Eğitime Başla</button>
                    <button class="menu-btn btn-orange" onclick="showScreen('task-select')">🧪 Uygulama Laboratuvarı</button>
                    <button class="menu-btn btn-red" onclick="showScreen('safety')">⚠️ Güvenlik Laboratuvarı</button>
                    <button class="menu-btn btn-purple" onclick="showResults()">📊 Sonuçlar</button>
                </div>
                <p class="footer-text">Meslek Lisesi Laboratuvar Teknikleri · Sahneyi fareyle döndür</p>
            </div>
        </div>

        <!-- EĞİTİM MODU -->
        <div id="screen-tutorial" class="screen">
            <div class="header">
                <h2 id="tutorial-title">Eğitim Modu</h2>
                <button class="btn-small" onclick="showScreen('menu')">🏠 Menü</button>
            </div>
            <div id="tutorial-content" class="content-card"></div>
            <div class="nav-buttons">
                <button class="btn btn-nav" id="btn-prev" onclick="prevLesson()">◀ Önceki</button>
                <span id="lesson-page">1 / 3</span>
                <button class="btn btn-nav" id="btn-next" onclick="nextLesson()">Sonraki ▶</button>
            </div>
        </div>

        <!-- GÖREV SEÇİMİ -->
        <div id="screen-task-select" class="screen">
            <div class="header">
                <h2>🧪 Görev Seçimi</h2>
                <button class="btn-small" onclick="showScreen('menu')">🏠 Menü</button>
            </div>
            <div id="task-list" class="task-list"></div>
        </div>

        <!-- LABORATUVAR (3D sahne üstünde kontrol paneli) -->
        <div id="screen-lab" class="screen lab-screen">
            <div class="lab-header">
                <div>
                    <h3 id="lab-step-title">Adım 1 / 7</h3>
                    <div class="lab-steps" id="lab-steps"></div>
                </div>
                <div class="lab-info" id="lab-task-desc"></div>
                <button class="btn-small" onclick="showScreen('menu')">🏠 Menü</button>
            </div>
            <div class="lab-spacer"></div>
            <div id="lab-content" class="lab-panel"></div>
        </div>

        <!-- GÜVENLİK LABORATUVARI -->
        <div id="screen-safety" class="screen lab-screen">
            <div class="header">
                <h2>⚠️ Güvenlik Laboratuvarı</h2>
                <button class="btn-small" onclick="showScreen('menu')">🏠 Menü</button>
            </div>
            <div class="lab-spacer"></div>
            <div id="safety-content" class="lab-panel safety-content"></div>
        </div>

        <!-- SONUÇLAR -->
        <div id="screen-results" class="screen">
            <div class="header">
                <h2>📊 Laboratuvar Sonucu</h2>
                <button class="btn-small" onclick="showScreen('menu')">🏠 Menü</button>
            </div>
            <div id="results-content" class="results-content"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
